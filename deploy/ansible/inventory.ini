[santa]
# Set ansible_host to your VM's IP (or WireGuard address) and the SSH user.
santa-vm ansible_host=10.0.0.10 ansible_user=ansible

[santa:vars]
ansible_python_interpreter=/usr/bin/python3
# Dedicated deploy key generated on this dev container (public half goes in the
# VM's authorized_keys for the ansible user).
ansible_ssh_private_key_file=~/.ssh/santa_vm_ed25519
